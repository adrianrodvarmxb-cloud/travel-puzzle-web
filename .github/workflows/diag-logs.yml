# INC-003 (temporal, no se fusiona): lista migraciones pendientes de D1 (solo lectura).
name: Diagnóstico INC-003 (logs)
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/diag-logs.yml"]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
jobs:
  logs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - run: npx -y wrangler@4 d1 migrations list travel-puzzle --remote 2>&1 | tail -20
