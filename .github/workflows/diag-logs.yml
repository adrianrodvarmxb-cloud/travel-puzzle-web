# INC-003 (temporal): captura excepciones del Worker de producción mientras se pide /tours.
# Solo imprime nombre y mensaje de excepciones/logs de error (sin cabeceras ni datos de la petición).
name: Diagnóstico INC-003 (logs)
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/diag-logs.yml"]
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
jobs:
  logs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: D1 insights (solo lectura)
        run: |
          npx -y wrangler@4 d1 insights travel-puzzle --sort-by=time --sort-direction=DESC --limit=8 --timePeriod=1d --json > ins.json 2>ins.err || true
          tail -3 ins.err
          node -e 'const a=JSON.parse(require("fs").readFileSync("ins.json","utf8")); for (const q of a) console.log("\n", Math.round(q.totalDurationMs||0)+"ms total ·", q.numberOfTimesRun+"x ·", "filas leídas "+(q.queryEfficiency!==undefined? "":"")+(q.totalRowsRead||q.avgRowsRead+" prom"), "\n ", String(q.query).slice(0,260))' || cat ins.json | head -c 3000
          echo; echo "--- tamaños"
          npx -y wrangler@4 d1 execute travel-puzzle --remote --json --command "select (select count(*) from tours) tours, (select count(*) from tour_translations) tr, (select count(*) from review_cache) rc" 2>/dev/null | head -c 600 || true
      - run: |
          (timeout 75 npx -y wrangler@4 tail travel-puzzle-web --format json > tail.json 2> tail.err &) 
          sleep 20
          for i in 1 2 3 4 5 6; do curl -s -o /dev/null -w "%{http_code} /tours\n" https://travelpuzzle.com.mx/tours; sleep 2; done
          sleep 50
          echo "--- tail stderr"; tail -5 tail.err
          echo "--- eventos"; grep -c '"outcome"' tail.json || true
          node -e '
          const lines=require("fs").readFileSync("tail.json","utf8").split(/\n(?=\{)/).filter(Boolean);
          for (const l of lines){ let e; try{e=JSON.parse(l)}catch{continue}
            const url=(e.event&&e.event.request&&e.event.request.url||"").replace(/\?.*/,"");
            const ex=(e.exceptions||[]).map(x=>x.name+": "+String(x.message).slice(0,400));
            const errs=(e.logs||[]).filter(x=>x.level==="error").map(x=>JSON.stringify(x.message).slice(0,600));
            if (ex.length||errs.length) console.log("\n#", e.outcome, url, "\n", ex.join("\n "), "\n", errs.join("\n "));
            else console.log("#", e.outcome, url);
          }'
