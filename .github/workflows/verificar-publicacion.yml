# REQ-1609 (gates A1 y B1 del PO, 12 nov 2026; de INC-010): si un deploy de `main` se revirtió o se canceló,
# producción queda atrás de `main` con el contenido del día fusionado pero fuera del aire, y hasta ahora nadie lo
# reintentaba. Este workflow lo comprueba cada 30 min: relanza el deploy UNA vez al día (gate B1) y, si vuelve a
# quedarse atrás, deja el motivo en un issue y se detiene. No toca el camino feliz de ningún agente diario.
name: Verificar publicación

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: verificar-publicacion
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  MARCA: publicacion-verificador

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reunir el estado
        id: estado
        run: |
          hoy=$(date -u +%Y-%m-%d)
          sha_main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          runs=$(gh api "repos/$REPO/actions/workflows/deploy-cloudflare.yml/runs?branch=main&per_page=20")
          ultimo=$(echo "$runs" | jq -c '[.workflow_runs[]][0] // null | if . == null then null else {status: .status, conclusion: .conclusion} end')
          exitoso=$(echo "$runs" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // empty')
          # Gate B1: cada relanzamiento deja su issue marcado; los de hoy son los reintentos de hoy.
          reintentos=$(gh api "repos/$REPO/issues?state=all&labels=$MARCA&per_page=100" \
            --jq "[.[] | select(.created_at | startswith(\"$hoy\"))] | length")
          jq -nc --arg m "$sha_main" --arg e "$exitoso" --argjson u "$ultimo" --argjson r "${reintentos:-0}" \
            '{shaMain: $m, shaUltimoExitoso: (if $e == "" then null else $e end), ultimoDeploy: $u, reintentosHoy: $r}' > estado.json
          cat estado.json
          echo "hoy=$hoy" >> "$GITHUB_OUTPUT"
          echo "sha_main=$sha_main" >> "$GITHUB_OUTPUT"

      - name: Decidir
        id: decidir
        run: npx tsx src/scripts/verificar-publicacion.ts estado.json >> "$GITHUB_OUTPUT"

      - name: Relanzar el deploy (gate A1)
        if: steps.decidir.outputs.accion == 'reintentar'
        env:
          MOTIVO: ${{ steps.decidir.outputs.motivo }}
          SHA_MAIN: ${{ steps.estado.outputs.sha_main }}
          HOY: ${{ steps.estado.outputs.hoy }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/actions/workflows/deploy-cloudflare.yml/dispatches" -f ref=main
          gh api "repos/$REPO/labels" -f name="$MARCA" -f color=0e8a16 -f description="Relanzamientos automáticos de la publicación" > /dev/null 2>&1 || true
          printf '%s\n' \
            "El último deploy de \`main\` no publicó y producción quedó atrás, así que se relanzó una vez (gate A1 y B1, REQ-1609)." \
            "" \
            "- Motivo: $MOTIVO" \
            "- HEAD de main: \`$SHA_MAIN\`" \
            "- Corrida del verificador: $RUN_URL" \
            "" \
            "Si este relanzamiento tampoco publica, el verificador no insiste: abre «Publicación: producción quedó atrás de main» y se detiene." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_" > cuerpo.md
          gh api "repos/$REPO/issues" -f title="Publicación: relanzada automáticamente $HOY" \
            -F body=@cuerpo.md -f "labels[]=$MARCA" --jq '"issue #" + (.number|tostring)'

      - name: Avisar y detenerse (gate B1)
        if: steps.decidir.outputs.accion == 'avisar'
        env:
          MOTIVO: ${{ steps.decidir.outputs.motivo }}
          SHA_MAIN: ${{ steps.estado.outputs.sha_main }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n' \
            "**Producción quedó atrás de \`main\`** y el verificador ya no relanza (gate B1: un intento al día)." \
            "" \
            "- Motivo: $MOTIVO" \
            "- HEAD de main: \`$SHA_MAIN\`" \
            "- Corrida del verificador: $RUN_URL" \
            "" \
            "El contenido del día está fusionado en \`main\` pero no en el aire. Para publicarlo hace falta lanzar «Publicar en Cloudflare» en \`main\` con el OK del PO (candado de deploy), después de revisar por qué se revirtió." \
            "" \
            "---" \
            "_Generated by [Claude Code](https://claude.ai/code)_" > cuerpo.md
          n=$(gh api "repos/$REPO/issues?state=open&labels=$MARCA&per_page=100" \
            --jq '[.[] | select(.title == "Publicación: producción quedó atrás de main")][0].number // empty')
          if [ -n "$n" ]; then
            gh api "repos/$REPO/issues/$n/comments" -F body=@cuerpo.md > /dev/null
          else
            gh api "repos/$REPO/labels" -f name="$MARCA" -f color=0e8a16 -f description="Relanzamientos automáticos de la publicación" > /dev/null 2>&1 || true
            gh api "repos/$REPO/issues" -f title="Publicación: producción quedó atrás de main" -F body=@cuerpo.md -f "labels[]=$MARCA" > /dev/null
          fi

      - name: Sin nada que hacer
        if: steps.decidir.outputs.accion == 'esperar'
        env:
          MOTIVO: ${{ steps.decidir.outputs.motivo }}
        run: |
          echo "Nada que hacer. $MOTIVO"
