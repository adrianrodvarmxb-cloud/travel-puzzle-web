# Publica el sitio en Cloudflare Workers.
# - Automático al fusionar a main (cada PR se fusiona con el OK del PO). No aplica migraciones.
# - A mano (Actions → Publicar en Cloudflare → Run workflow) cuando hay migraciones de D1:
#   marcar la casilla es el OK de la migración.
# - Ensayo (REQ-155, INC-006): Run workflow con «ensayo» marcado, en cualquier rama. Sube una versión SIN tráfico
#   con sus secretos y le corre la prueba de humo; nunca publica ni aplica migraciones.
name: Publicar en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      migraciones:
        description: "Aplicar migraciones de la base D1 antes de publicar"
        type: boolean
        default: false
      ensayo:
        description: "Ensayo: subir versión sin tráfico y probarla, SIN publicar (REQ-155)"
        type: boolean
        default: false

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
  NEXT_TELEMETRY_DISABLED: "1"
  # REQ-1598: cuentas de cliente encendidas (Next fija NEXT_PUBLIC_* al construir). Apagar = quitar esta línea.
  NEXT_PUBLIC_ACCOUNTS_ENABLED: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npx vitest run

      - name: Lista de países (desde Freetour)
        if: hashFiles('data/countries.json') == ''
        env:
          FREETOUR_ENV: production
          FREETOUR_EMAIL: ${{ secrets.FREETOUR_EMAIL }}
          FREETOUR_PASSWORD: ${{ secrets.FREETOUR_PASSWORD }}
        run: npm run countries:generate

      - name: Cliente de Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: file:./dev.db

      # REQ-224 (INC-001): un error de tipos detiene el deploy antes de migraciones y build.
      - name: Tipos (tsc)
        run: npx tsc --noEmit

      # REQ-3323: respaldo antes de tocar datos (regla del PO). Anota el punto de regreso de D1 (Time Travel)
      # ANTES de migrar y lo deja en el resumen de la corrida; si la migración sale mal, se restaura a ese bookmark
      # con `wrangler d1 time-travel restore travel-puzzle --bookmark <...>`. Solo lee: no escribe en la base.
      - name: Punto de regreso de D1 (Time Travel) antes de migrar
        if: github.event_name == 'workflow_dispatch' && inputs.migraciones && !inputs.ensayo
        run: |
          npx wrangler d1 time-travel info travel-puzzle | tee "$RUNNER_TEMP/d1-punto-de-regreso.txt"
          {
            echo "## Punto de regreso de D1 (antes de migrar)"
            echo '```'
            cat "$RUNNER_TEMP/d1-punto-de-regreso.txt"
            echo '```'
            echo "Para regresar: \`npx wrangler d1 time-travel restore travel-puzzle --bookmark <bookmark de arriba>\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Migraciones D1
        if: github.event_name == 'workflow_dispatch' && inputs.migraciones && !inputs.ensayo
        run: npx wrangler d1 migrations apply travel-puzzle --remote

      - name: Construir
        run: npx opennextjs-cloudflare build

      # REQ-155 (INC-006): los secretos viajan DENTRO de la versión que se prueba y se despliega.
      # Antes se ponían con `wrangler secret put` después de publicar, y eso falla en cuanto un PR sube su propia
      # versión de prueba (la «última versión» deja de ser la desplegada). El archivo vive en RUNNER_TEMP (0600),
      # nunca se imprime y se borra al final pase lo que pase.
      - name: Secretos de la versión
        env:
          SECRETOS_FILE: ${{ runner.temp }}/secretos-worker.json
          FREETOUR_EMAIL: ${{ secrets.FREETOUR_EMAIL }}
          FREETOUR_PASSWORD: ${{ secrets.FREETOUR_PASSWORD }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: npx tsx src/scripts/worker-secrets.ts "$SECRETOS_FILE"

      # REQ-003 (INC-001): ningún deploy llega a producción si la prueba de humo falla.
      # 1) Se sube una VERSIÓN sin tráfico (con los datos, banderas y secretos reales) y se obtiene su URL de preview.
      #    REQ-155: hasta 3 intentos ante fallas pasajeras de la API de Cloudflare (503 / 10013 del 6 nov 2026).
      - name: Subir versión (sin tráfico)
        id: version
        env:
          SECRETOS_FILE: ${{ runner.temp }}/secretos-worker.json
        run: |
          for intento in 1 2 3; do
            npx opennextjs-cloudflare upload --secrets-file="$SECRETOS_FILE" 2>&1 | tee upload.log || true
            vid=$(grep -oE "Worker Version ID: [0-9a-f-]+" upload.log | awk '{print $4}' | tail -1)
            url=$(grep -oE "https://[a-z0-9-]+-travel-puzzle-web\.[a-z0-9-]+\.workers\.dev" upload.log | tail -1)
            if [ -n "$vid" ] && [ -n "$url" ]; then break; fi
            if [ "$intento" -lt 3 ]; then echo "::warning::Intento $intento de subir la versión falló; reintento en $((intento * 30)) s."; sleep $((intento * 30)); fi
          done
          if [ -z "$vid" ] || [ -z "$url" ]; then echo "::error::No se obtuvo la versión o su URL de preview. NO SE PUBLICA."; exit 1; fi
          echo "id=$vid" >> "$GITHUB_OUTPUT"; echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Borrar archivo de secretos
        if: always()
        env:
          SECRETOS_FILE: ${{ runner.temp }}/secretos-worker.json
        run: rm -f "$SECRETOS_FILE"

      # REQ-155: evidencia (solo nombres) de que la versión lleva sus secretos.
      - name: Secretos en la versión (solo nombres)
        continue-on-error: true
        run: |
          npx wrangler versions view "${{ steps.version.outputs.id }}" --json > version.json
          node -e 'const v=JSON.parse(require("fs").readFileSync("version.json","utf8"));const b=(v.resources?.bindings??[]).filter(x=>x.type==="secret_text").map(x=>x.name);console.log("Secretos en la versión:",b.join(", ")||"(ninguno)");'

      - name: Navegador para la prueba de humo
        run: npx playwright install --with-deps chromium

      # 2) Prueba de humo contra esa versión: 390 y 1366 px, sin excepciones ni "Application error".
      # REQ-500 (INC-007): si una página falla, guarda HTML crudo, DOM, errores y captura, y la recarga una vez.
      - name: Prueba de humo (antes de publicar)
        env:
          SMOKE_EVIDENCE_DIR: smoke-evidencia/antes-de-publicar
        run: npx tsx src/scripts/smoke.ts "${{ steps.version.outputs.url }}"

      # 3) Solo si pasó: se le da el 100% del tráfico (nunca en ensayo).
      - name: Publicar
        id: publicar
        if: ${{ !inputs.ensayo }}
        run: npx wrangler versions deploy "${{ steps.version.outputs.id }}@100%" --yes --message "deploy ${{ github.sha }}"

      # OCULTO (REQ-155, INC-006): reemplazado por «Secretos de la versión» + --secrets-file. Se conserva apagado
      # para regresar rápido: quitar el `if: false` (y el --secrets-file) restaura el flujo anterior.
      - name: Secretos del Worker (anterior, apagado)
        if: ${{ false }}
        env:
          FREETOUR_EMAIL: ${{ secrets.FREETOUR_EMAIL }}
          FREETOUR_PASSWORD: ${{ secrets.FREETOUR_PASSWORD }}
          GATEWAY_SECRET: ${{ secrets.GATEWAY_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: |
          existentes=$(npx wrangler secret list --format json 2>/dev/null || echo "[]")
          tiene() { echo "$existentes" | grep -q "\"name\": *\"$1\""; }
          # Credenciales de Freetour: siempre las de GitHub (por si cambian)
          printf '%s' "$FREETOUR_EMAIL" | npx wrangler secret put FREETOUR_EMAIL
          printf '%s' "$FREETOUR_PASSWORD" | npx wrangler secret put FREETOUR_PASSWORD
          # Pasarela de reservas: el mismo secreto que en cPanel (si ya está en GitHub)
          if [ -n "$GATEWAY_SECRET" ]; then printf '%s' "$GATEWAY_SECRET" | npx wrangler secret put GATEWAY_SECRET; fi
          # Correos (Resend), si ya está en GitHub
          if [ -n "$RESEND_API_KEY" ]; then printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY; fi
          # Tipo de cambio FIX de Banxico (viajes propios), si ya está en GitHub
          if [ -n "$BANXICO_TOKEN" ]; then printf '%s' "$BANXICO_TOKEN" | npx wrangler secret put BANXICO_TOKEN; fi
          # REQ-187: llave del catálogo del agente de WhatsApp. Se crea una sola vez, aquí, justo después de publicar
          # (Cloudflare no deja cambiar secretos si la última versión no es la publicada). Primero en mila-zoefel y luego
          # aquí: si lo segundo falla, la próxima publicación la vuelve a crear en los dos. Nunca se imprime.
          if ! tiene AGENTE_TOKEN; then
            llave=$(openssl rand -hex 32); echo "::add-mask::$llave"
            printf '%s' "$llave" | npx wrangler secret put CATALOGO_TRAVEL_PUZZLE --name mila-zoefel > /dev/null
            printf '%s' "$llave" | npx wrangler secret put AGENTE_TOKEN > /dev/null
            unset llave; echo "Llave del agente creada (mila-zoefel y travel-puzzle-web)."
          fi
          # Claves internas: se generan una sola vez y se conservan
          for n in CRON_SECRET AUTH_SECRET; do
            if ! tiene "$n"; then openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put "$n"; fi
          done

      # REQ-1358 (INC-009): la preview de workers.dev no tiene Cache API, así que el humo de antes de publicar no calienta
      # la caché de producción. Con una llave nueva, la primera petición a /destinos reconstruye el árbol en frío (11–18 s)
      # y puede dar 503. Aquí se calientan las páginas pesadas (con reintentos y el tiempo de cada intento en el registro);
      # este paso no tumba el deploy: lo juzga la prueba de humo, que sigue exigiendo 200 en todo.
      - name: Calentar la caché de producción (INC-009)
        if: always() && steps.publicar.outcome == 'success'
        continue-on-error: true
        run: |
          for p in /destinos /en/destinos /tours /en/tours / /en /la-primera-pieza /sitemap-index.xml; do  # «/en/» responde 308 a «/en»
            for intento in 1 2 3 4 5 6; do
              r=$(curl -s -o /dev/null -A "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)" -w "%{http_code} %{time_total}" --max-time 60 "https://travelpuzzle.com.mx$p" || echo "000 60")
              echo "calentar $p intento $intento: $r"
              [ "${r%% *}" = "200" ] && break
              sleep 15
            done
          done

      # 4) Prueba de humo en producción; si falla, se regresa a la versión anterior y el job queda en rojo.
      - name: Prueba de humo (producción)
        id: smoke_prod
        if: always() && steps.publicar.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_EVIDENCE_DIR: smoke-evidencia/produccion
        run: npx tsx src/scripts/smoke.ts https://travelpuzzle.com.mx

      - name: Regresar a la versión anterior si falló
        if: always() && steps.smoke_prod.outcome == 'failure'
        run: |
          yes | npx wrangler rollback --message "rollback automatico: prueba de humo fallida ${{ github.sha }}"
          echo "::error::La prueba de humo en producción falló; se regresó a la versión anterior."
          exit 1

      # REQ-500 (INC-007): la evidencia de cualquier falla de humo queda como artefacto del job (solo páginas públicas).
      - name: Evidencia de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-humo-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-evidencia/
          if-no-files-found: ignore
          retention-days: 30
