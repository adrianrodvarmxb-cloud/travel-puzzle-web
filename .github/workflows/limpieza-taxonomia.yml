# REQ-3511 (INC-015): limpieza ÚNICA de ExperienceTaxonomy en producción. A mano; por omisión ENSAYO (solo cuenta corridas).
# Borra, en tandas de 20 mil filas, las filas de corridas que el sitio ya no lee: conserva la corrida en curso y las 3
# publicadas más recientes (KEEP_TAXONOMY_RUNS), igual que la poda del recálculo. TaxonomyRun (la bitácora) no se toca.
# CANDADO: datos de producción, solo con OK del PO. Antes de borrar se anota el punto de regreso de D1 (Time Travel).
name: Limpieza de taxonomía (INC-015)
on:
  workflow_dispatch:
    inputs:
      borrar:
        description: "Borrar en producción (candado del PO). Sin marcar = ensayo"
        type: boolean
        default: false
permissions:
  contents: read
concurrency: { group: datos-produccion, cancel-in-progress: false }
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
  CONSERVAR: "SELECT \"id\" FROM \"TaxonomyRun\" WHERE \"status\"='running' UNION SELECT \"id\" FROM (SELECT \"id\" FROM \"TaxonomyRun\" WHERE \"status\"='published' ORDER BY \"finishedAt\" DESC LIMIT 3)"
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Corridas que se conservan y que se limpian (solo lectura)
        run: |
          npx wrangler d1 execute travel-puzzle --remote --json --command "SELECT \"status\", COUNT(*) AS corridas, SUM(CASE WHEN \"id\" IN ($CONSERVAR) THEN 1 ELSE 0 END) AS se_conservan FROM \"TaxonomyRun\" GROUP BY \"status\"" | tee "$RUNNER_TEMP/corridas.json"
          { echo "## Corridas de taxonomía"; echo '```'; cat "$RUNNER_TEMP/corridas.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Punto de regreso de D1 (Time Travel) antes de borrar
        if: inputs.borrar
        run: |
          npx wrangler d1 time-travel info travel-puzzle | tee "$RUNNER_TEMP/punto.txt"
          { echo "## Punto de regreso de D1 (antes de borrar)"; echo '```'; cat "$RUNNER_TEMP/punto.txt"; echo '```'
            echo "Para regresar: \`npx wrangler d1 time-travel restore travel-puzzle --bookmark <bookmark de arriba>\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Borrar por tandas
        if: inputs.borrar
        run: |
          total=0; ronda=0
          while :; do
            ronda=$((ronda+1))
            n=$(npx wrangler d1 execute travel-puzzle --remote --json --command "DELETE FROM \"ExperienceTaxonomy\" WHERE rowid IN (SELECT rowid FROM \"ExperienceTaxonomy\" WHERE \"runId\" NOT IN ($CONSERVAR) LIMIT 20000)" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j[0].meta.changes??0)})')
            total=$((total+n)); echo "ronda $ronda: $n filas (total $total)"
            [ "$n" -gt 0 ] || break
            sleep 2   # deja respirar a D1: el sitio sigue leyendo la misma base
          done
          echo "## Filas borradas: $total en $ronda rondas" >> "$GITHUB_STEP_SUMMARY"
