# Solo lectura: lista las migraciones de D1 pendientes en producción. NO aplica nada.
# A mano: Actions → «Migraciones pendientes (solo lectura)» → Run workflow.
# Usa el mismo secreto que el deploy (CLOUDFLARE_API_TOKEN). Nunca escribe en la base.
name: Migraciones pendientes (solo lectura)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f

jobs:
  listar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Migraciones pendientes en D1 (solo lectura)
        run: npx wrangler d1 migrations list travel-puzzle --remote
