# Solo lectura: estado de las corridas del sync blindado (SyncRun) y conteos de Tour/City. No escribe en D1.
name: Sync blindado (vigilar)
on:
  push:
    branches: [ops/sync-monitor]
  workflow_dispatch:
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
jobs:
  ver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultas de solo lectura
        run: |
          set -euo pipefail
          q() { npx -y wrangler@4 d1 execute travel-puzzle --remote --json --command "$1" | jq -c '.[0].results'; }
          echo "== SyncRun (últimas 5) =="; q 'SELECT * FROM "SyncRun" ORDER BY rowid DESC LIMIT 5'
          echo "== Tour =="; q 'SELECT COUNT(*) total, SUM("contentHash" IS NOT NULL) conHash, SUM("syncStatus"='"'active'"') activos, SUM("syncStatus"<>'"'active'"') otros FROM "Tour"'
          echo "== TourStage =="; q 'SELECT COUNT(*) n FROM "TourStage"'
          echo "== City =="; q 'SELECT SUM("indexableSince" IS NOT NULL) indexables, SUM("failingSince" IS NOT NULL) fallando FROM "City"'
          echo "== Tamaño =="; npx -y wrangler@4 d1 info travel-puzzle --json | jq '{database_size}'
