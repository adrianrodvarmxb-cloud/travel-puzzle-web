# REQ-039: carga de viajes de un operador desde imports/<archivo>.json.
# Por defecto es ENSAYO: baja fotos, valida y genera el SQL como artefacto; solo LEE una fecha de D1 para copiar su formato.
# Escribir en producción (R2 + D1) solo con workflow_dispatch, escribir=true y OK del PO (candado: datos de producción).
name: Importar viajes
on:
  push:
    branches: [feat/inca-carga]
    paths: [imports/**, src/trips/lib/bulk-import.ts, src/scripts/import-trips.ts, .github/workflows/importar-viajes.yml]
  workflow_dispatch:
    inputs:
      archivo:
        description: "Archivo en imports/ (p. ej. incaworld-etapa1.json)"
        required: true
      escribir:
        description: "Escribir en producción (R2 + D1)"
        type: boolean
        default: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
  ARCHIVO: imports/${{ inputs.archivo || 'incaworld-etapa1.json' }}
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fotos del operador (enlace de Drive que compartió Inca World)
        run: |
          mkdir -p operador && cd operador
          curl -sSL -o fotos.rar "https://drive.usercontent.google.com/download?id=1ni8juVBRMsssjGXJ-Ev5h3Uhlbq0kS2E&export=download&confirm=t"
          7z x -y fotos.rar > /dev/null
          dir=$(dirname "$(find . -type d -name '04_Patrimonio_Cusco' | head -1)")
          echo "OPERADOR_DIR=$PWD/$dir" >> "$GITHUB_ENV"
      - name: Formato de fecha de la base (solo lectura)
        run: |
          s=$(npx wrangler d1 execute travel-puzzle --remote --json --command 'SELECT "createdAt" AS c FROM "Tour" LIMIT 1' | jq -r '.[0].results[0].c')
          echo "Muestra: $s"
          echo "NOW_SAMPLE=$s" >> "$GITHUB_ENV"
      - name: Preparar carga (fotos + validación + SQL)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: npx tsx src/scripts/import-trips.ts "$ARCHIVO" salida "$OPERADOR_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: carga-viajes, path: salida, retention-days: 7 }
      - name: Subir fotos a R2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.escribir }}
        run: |
          cd salida/fotos
          find trips -type f | while read k; do npx wrangler r2 object put "travel-puzzle-trips/$k" --file "$k" --remote > /dev/null && echo "R2 $k"; done
      - name: Escribir viajes en D1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.escribir }}
        run: npx wrangler d1 execute travel-puzzle --remote --file salida/import.sql
