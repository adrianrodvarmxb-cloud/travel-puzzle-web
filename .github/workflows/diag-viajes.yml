# Diagnóstico de viajes (incidente 165 de 371). SOLO LECTURA: únicamente SELECT. Rama diag/viajes-conteo; no se mergea.
name: Diag viajes (solo lectura)
on:
  push:
    branches: [diag/viajes-conteo]
    paths: [.github/workflows/diag-viajes.yml]
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Consultas (solo SELECT)
        run: |
          q() { echo "### $1"; npx wrangler d1 execute travel-puzzle --remote --json --command "$2" | jq -c '.[0].results[]'; }
          q "agencia x status x kind" "SELECT COALESCE(a.name,'Travel Puzzle') ag, a.isActive act, t.status, t.kind, COUNT(*) n FROM Trip t LEFT JOIN Agency a ON a.id=t.agencyId GROUP BY 1,2,3,4 ORDER BY 1,3,4"
          q "published: rango por updatedAt (take 200)" "SELECT ag, SUM(rk<=200) dentro, SUM(rk>200) fuera FROM (SELECT COALESCE(a.name,'Travel Puzzle') ag, ROW_NUMBER() OVER (ORDER BY t.updatedAt DESC) rk FROM Trip t LEFT JOIN Agency a ON a.id=t.agencyId WHERE t.status='published') GROUP BY ag"
          q "published sin ProviderRecord" "SELECT COALESCE(a.name,'Travel Puzzle') ag, SUM(pr.n IS NULL) sin_crudo, SUM(pr.doc=0) sin_doc, COUNT(*) n FROM Trip t LEFT JOIN Agency a ON a.id=t.agencyId LEFT JOIN (SELECT experienceId, COUNT(*) n, SUM(sourceDocKey IS NOT NULL) doc FROM ProviderRecord WHERE experienceKind='trip' GROUP BY experienceId) pr ON pr.experienceId=t.id WHERE t.status='published' GROUP BY 1"
          q "tour activos (inicio)" "SELECT COUNT(*) n FROM Tour WHERE isActive=1"
          q "published lista" "SELECT ROW_NUMBER() OVER (ORDER BY t.updatedAt DESC) rk, t.id, t.slug, t.kind, COALESCE(a.name,'Travel Puzzle') ag, t.countries, t.cities, t.updatedAt FROM Trip t LEFT JOIN Agency a ON a.id=t.agencyId WHERE t.status='published' ORDER BY rk"
