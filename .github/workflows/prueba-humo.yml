# REQ-003 (INC-001): en cada PR se sube una versión SIN tráfico y se le corre la prueba de humo
# con navegador real (390 y 1366 px). Producción no cambia. Si falla, el PR no se debe fusionar.
name: Prueba de humo (PR)

on:
  pull_request:
    branches: [main]

concurrency:
  group: smoke-${{ github.head_ref }}
  cancel-in-progress: true

# REQ-226: solo lectura de Actions, para esperar a que main termine de publicar antes de subir la versión del PR.
permissions:
  contents: read
  actions: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npx vitest run
      - name: Lista de países (desde Freetour)
        env:
          FREETOUR_ENV: production
          FREETOUR_EMAIL: ${{ secrets.FREETOUR_EMAIL }}
          FREETOUR_PASSWORD: ${{ secrets.FREETOUR_PASSWORD }}
        run: npm run countries:generate
      - name: Cliente de Prisma
        run: npx prisma generate
        env:
          DATABASE_URL: file:./dev.db
      # REQ-224 (INC-001): un error de tipos detiene el PR antes de construir.
      - name: Tipos (tsc)
        run: npx tsc --noEmit
      - name: Construir
        run: npx opennextjs-cloudflare build
      # REQ-226: si main está publicando, se espera (máx. 20 min). Una versión de PR subida a la mitad de la publicación
      # deja a main sin poder cargar sus secretos ni correr la prueba de humo en producción (6 nov 2026, 15e7cfd).
      - name: Esperar a que main termine de publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=0
            for st in in_progress queued; do
              c=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy-cloudflare.yml/runs?status=$st&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
              n=$((n + c))
            done
            [ "$n" -eq 0 ] && { echo "Sin publicación en curso."; exit 0; }
            echo "Hay $n publicación(es) de main en curso; espero 30 s ($i/40)."; sleep 30
          done
          echo "::warning::main sigue publicando después de 20 min; se sube de todos modos."
      - name: Subir versión (sin tráfico)
        id: version
        run: |
          npx opennextjs-cloudflare upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee upload.log || npx opennextjs-cloudflare upload 2>&1 | tee upload.log
          url=$(grep -oE "https://[a-z0-9-]+-travel-puzzle-web\.[a-z0-9-]+\.workers\.dev" upload.log | tail -1)
          if [ -z "$url" ]; then echo "::error::No se obtuvo la URL de preview."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Navegador
        run: npx playwright install --with-deps chromium
      # REQ-500 (INC-007): si una página falla, guarda HTML crudo, DOM, errores y captura, y la recarga una vez.
      - name: Prueba de humo
        env:
          SMOKE_EVIDENCE_DIR: smoke-evidencia/pr
        run: npx tsx src/scripts/smoke.ts "${{ steps.version.outputs.url }}"
      - name: Evidencia de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-humo-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: smoke-evidencia/
          if-no-files-found: ignore
          retention-days: 30
