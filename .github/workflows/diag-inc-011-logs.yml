# INC-011 / REQ-1600 (temporal, NO SE FUSIONA): lee de Workers Logs los errores de travel-puzzle-web
# del 11-11 entre 23:05 y 23:16 UTC (digest 1123893058). Solo lectura; no cambia nada en Cloudflare.
name: Diagnóstico INC-011 (logs)
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/diag-inc-011-logs.yml"]
permissions:
  contents: read
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
jobs:
  logs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Errores del Worker entre 23:05 y 23:16 UTC del 11-11
        run: |
          set -u
          q() {
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$1"
          }
          BODY='{"queryId":"inc-011","timeframe":{"from":1794438300000,"to":1794438960000},"view":"events","limit":200,
                 "parameters":{"filters":[{"key":"$metadata.service","operation":"eq","type":"string","value":"travel-puzzle-web"}]}}'
          q "$BODY" > r.json
          echo "success: $(jq -r '.success' r.json)"; jq -c '.errors // empty' r.json
          echo "--- claves del primer evento"
          jq -c '[.. | objects | select(has("$metadata"))][0] | keys' r.json 2>/dev/null || true
          echo "--- eventos con error, digest o 500 (máx 40, 1500 caracteres cada uno)"
          jq -c '[.. | objects | select(has("$metadata"))] | map(select((tostring|test("1123893058|digest|\"error\"|level\":\"error|500|Error";"i"))))[:40][]' r.json | cut -c1-1500
          echo "--- total de eventos: $(jq '[.. | objects | select(has("$metadata"))] | length' r.json)"
