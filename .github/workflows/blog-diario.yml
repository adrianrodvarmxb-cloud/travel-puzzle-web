# REQ-975: publicación diaria del blog SIN revisión del PO (gate «Publica solo cada día»,
# docs/gates-blog-diario-2026-11-06.md, G1–G3). El merge squash que hace este workflow ES la publicación.
#
# Entrada: workflow_dispatch con el JSON de la entrada (o su base64), o push a una rama blog/entrada-* con
# docs/blog/entradas/AAAA-MM-DD.json. Pasos: valida (src/scripts/blog-diario.ts) → rama y PR que SOLO cambia
# src/blog/content/diario.json → pruebas, tsc, build y prueba de humo con BLOG_ENABLED="true" SOLO en el preview →
# merge squash → lanza «Publicar en Cloudflare» (con su humo y regreso automático) → aviso a IndexNow.
# Si algo falla NO publica y deja el motivo en el issue «Blog diario: no se publicó».
#
# Nota: un PR o un push hechos con GITHUB_TOKEN no disparan otros workflows. Por eso aquí corre la prueba de humo
# del PR y el deploy se lanza con workflow_dispatch (eso sí lo permite GitHub).
name: Blog diario

on:
  workflow_dispatch:
    inputs:
      entrada:
        description: "Entrada del agente en JSON (o el JSON en base64)"
        required: true
        type: string
  push:
    branches: ["blog/entrada-*"]
    paths: ["docs/blog/entradas/*.json"]

concurrency:
  group: blog-diario
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 8f59d128de3553d7b9b929aaa9be920f
  NEXT_TELEMETRY_DISABLED: "1"
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Leer la entrada
        env:
          ENTRADA: ${{ inputs.entrada }}
          EVENTO: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          B="$RUNNER_TEMP/blog"; mkdir -p "$B"; echo "Leer la entrada" > "$B/paso"
          if [ "$EVENTO" = "push" ]; then
            git fetch -q origin "$SHA"
            f=$(git diff-tree --no-commit-id --name-only -r "$SHA" | grep -E '^docs/blog/entradas/[^/]+\.json$' | tail -1)
            [ -n "$f" ] || { echo "El push no trae docs/blog/entradas/*.json" > "$B/motivo"; exit 1; }
            git show "$SHA:$f" > "$B/entrada.json"
          else
            node -e 'const s=(process.env.ENTRADA||"").trim();const t=s.startsWith("{")?s:Buffer.from(s,"base64").toString("utf8");JSON.parse(t);require("fs").writeFileSync(process.argv[1],t)' "$B/entrada.json" \
              || { echo "La entrada no es JSON válido (ni base64 de JSON)" > "$B/motivo"; exit 1; }
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validar y agregar a diario.json
        id: validar
        run: |
          B="$RUNNER_TEMP/blog"; echo "Validador del blog diario" > "$B/paso"
          if ! npx tsx src/scripts/blog-diario.ts validar "$B/entrada.json" --agregar --salida "$B/resultado.json"; then
            node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log((r.problems||[]).map(p=>"- "+p).join("\n"))' "$B/resultado.json" > "$B/motivo" 2>/dev/null || echo "- el validador falló sin resultado" > "$B/motivo"
            exit 1
          fi
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const k of ["slug","pillar","title","mix","fecha","path","url"])console.log(k+"="+String(r[k]).replace(/\n/g," "))' "$B/resultado.json" >> "$GITHUB_OUTPUT"
          # G2: el único archivo que cambia es diario.json.
          cambios=$(git status --porcelain | awk '{print $2}' | sort -u)
          if [ "$cambios" != "src/blog/content/diario.json" ]; then echo "- cambios fuera de diario.json: $cambios" > "$B/motivo"; exit 1; fi

      - name: Rama y PR
        id: pr
        env:
          SLUG: ${{ steps.validar.outputs.slug }}
          FECHA: ${{ steps.validar.outputs.fecha }}
          TITULO: ${{ steps.validar.outputs.title }}
          MIX: ${{ steps.validar.outputs.mix }}
          URL: ${{ steps.validar.outputs.url }}
        run: |
          B="$RUNNER_TEMP/blog"; echo "Rama y PR" > "$B/paso"
          rama="blog/diario-$FECHA-$SLUG"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$rama"
          git add src/blog/content/diario.json
          git commit -q -m "blog(diario): $TITULO ($FECHA, $MIX) — REQ-975" -m "Entrada del agente diario, publicada por el gate «Publica solo cada día» (docs/gates-blog-diario-2026-11-06.md)."
          git push -q origin "$rama"
          printf '%s\n' "Entrada del agente diario: **$TITULO** ($FECHA, $MIX)." "" "- URL al publicar: $URL" "- Solo cambia \`src/blog/content/diario.json\`." "- Se fusiona solo si pasan el validador, la suite, tsc, el build y la prueba de humo con \`BLOG_ENABLED\` encendida en el preview (gate G1–G2)." "- Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$B/pr.md"
          n=$(gh api "repos/$REPO/pulls" -f title="blog(diario): $TITULO ($FECHA)" -f head="$rama" -f base=main -F body=@"$B/pr.md" --jq .number)
          echo "number=$n" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"; echo "$n" > "$B/pr"

      - name: Pruebas
        run: echo "Pruebas (vitest)" > "$RUNNER_TEMP/blog/paso" && npx vitest run

      - name: Lista de países (desde Freetour)
        env:
          FREETOUR_ENV: production
          FREETOUR_EMAIL: ${{ secrets.FREETOUR_EMAIL }}
          FREETOUR_PASSWORD: ${{ secrets.FREETOUR_PASSWORD }}
        run: echo "Lista de países" > "$RUNNER_TEMP/blog/paso" && npm run countries:generate

      - name: Cliente de Prisma
        env:
          DATABASE_URL: file:./dev.db
        run: npx prisma generate

      - name: Tipos (tsc)
        run: echo "Tipos (tsc)" > "$RUNNER_TEMP/blog/paso" && npx tsc --noEmit

      # CLAUDE.md, punto 3: la prueba de humo se corre con la bandera ENCENDIDA en el preview. Solo en esta copia de
      # trabajo; el PR no lleva este cambio y producción conserva su valor.
      - name: Blog encendido solo para el preview
        run: |
          echo "Blog encendido en el preview" > "$RUNNER_TEMP/blog/paso"
          sed -i 's/"BLOG_ENABLED": "false"/"BLOG_ENABLED": "true"/' wrangler.jsonc
          grep -q '"BLOG_ENABLED": "true"' wrangler.jsonc
          grep -q '"BLOG_SHOW_DRAFTS": "false"' wrangler.jsonc

      - name: Construir
        run: echo "Construir" > "$RUNNER_TEMP/blog/paso" && npx opennextjs-cloudflare build

      - name: Esperar a que main termine de publicar
        run: |
          for i in $(seq 1 40); do
            n=0
            for st in in_progress queued; do
              c=$(gh api "repos/$REPO/actions/workflows/deploy-cloudflare.yml/runs?status=$st&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
              n=$((n + c))
            done
            [ "$n" -eq 0 ] && exit 0
            echo "Hay $n publicación(es) de main en curso; espero 30 s ($i/40)."; sleep 30
          done

      - name: Subir versión (sin tráfico)
        id: version
        run: |
          echo "Subir versión de preview" > "$RUNNER_TEMP/blog/paso"
          npx opennextjs-cloudflare upload --preview-alias "blog-${{ steps.pr.outputs.number }}" 2>&1 | tee upload.log || npx opennextjs-cloudflare upload 2>&1 | tee upload.log
          url=$(grep -oE "https://[a-z0-9-]+-travel-puzzle-web\.[a-z0-9-]+\.workers\.dev" upload.log | tail -1)
          [ -n "$url" ] || { echo "- no se obtuvo la URL de preview" > "$RUNNER_TEMP/blog/motivo"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Navegador
        run: npx playwright install --with-deps chromium

      - name: Prueba de humo (preview con el blog encendido)
        env:
          BLOG_ENABLED: "true"
          SMOKE_EVIDENCE_DIR: smoke-evidencia/blog
          PREVIEW: ${{ steps.version.outputs.url }}
          RUTA: ${{ steps.validar.outputs.path }}
        run: |
          echo "Prueba de humo del preview" > "$RUNNER_TEMP/blog/paso"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PREVIEW$RUTA")
          [ "$code" = "200" ] || { echo "- la entrada responde $code en el preview ($RUTA)" > "$RUNNER_TEMP/blog/motivo"; exit 1; }
          npx tsx src/scripts/smoke.ts "$PREVIEW"

      - name: Evidencia de la prueba de humo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-humo-blog-${{ github.run_id }}
          path: smoke-evidencia/
          if-no-files-found: ignore
          retention-days: 30

      # G2: el merge es la publicación. `sha` asegura que se fusiona exactamente lo que se probó.
      - name: Merge squash (publicación)
        run: |
          echo "Merge squash" > "$RUNNER_TEMP/blog/paso"
          git checkout -- wrangler.jsonc
          gh api -X PUT "repos/$REPO/pulls/${{ steps.pr.outputs.number }}/merge" -f merge_method=squash -f sha="${{ steps.pr.outputs.sha }}" --jq .merged | grep -q true

      - name: Publicar en Cloudflare (deploy con su humo y regreso automático)
        run: |
          echo "Deploy de producción" > "$RUNNER_TEMP/blog/paso"
          desde=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api -X POST "repos/$REPO/actions/workflows/deploy-cloudflare.yml/dispatches" -f ref=main
          id=""
          for i in $(seq 1 20); do
            sleep 15
            id=$(gh api "repos/$REPO/actions/workflows/deploy-cloudflare.yml/runs?event=workflow_dispatch&branch=main&per_page=5" --jq "[.workflow_runs[] | select(.created_at >= \"$desde\")][0].id // empty")
            [ -n "$id" ] && break
          done
          [ -n "$id" ] || { echo "- no arrancó el deploy" > "$RUNNER_TEMP/blog/motivo"; exit 1; }
          for i in $(seq 1 120); do
            st=$(gh api "repos/$REPO/actions/runs/$id" --jq '.status + " " + (.conclusion // "")')
            case "$st" in completed\ success) echo "Deploy $id en verde."; exit 0;; completed*) echo "- el deploy $id terminó: $st (con su regreso automático si falló el humo de producción)" > "$RUNNER_TEMP/blog/motivo"; exit 1;; esac
            sleep 30
          done
          echo "- el deploy $id no terminó en 60 min" > "$RUNNER_TEMP/blog/motivo"; exit 1

      - name: Aviso a IndexNow (si está encendido)
        continue-on-error: true
        run: npx tsx src/scripts/blog-indexnow.ts "${{ steps.validar.outputs.path }}"

      - name: Registrar la publicación
        run: |
          gh api "repos/$REPO/issues/${{ steps.pr.outputs.number }}/comments" -f body="Publicado: ${{ steps.validar.outputs.url }} (merge squash por el gate «Publica solo cada día»; deploy y humo de producción en verde)." > /dev/null

      - name: Dejar el motivo en un issue (NO PUBLICADO)
        if: failure()
        run: |
          B="$RUNNER_TEMP/blog"
          paso=$(cat "$B/paso" 2>/dev/null || echo "desconocido")
          motivo=$(cat "$B/motivo" 2>/dev/null || echo "- ver el registro de la corrida")
          pr=$(cat "$B/pr" 2>/dev/null || echo "")
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '%s\n' "**NO PUBLICADO** — $(date -u +%Y-%m-%d) (UTC)" "" "Paso que falló: $paso" "" "Motivo:" "$motivo" "" "${pr:+PR sin fusionar: #$pr}" "Corrida: $run" > "$B/issue.md"
          gh api "repos/$REPO/labels" -f name=blog-diario -f color=d93f0b -f description="Avisos del blog diario" > /dev/null 2>&1 || true
          n=$(gh api "repos/$REPO/issues?state=open&labels=blog-diario&per_page=1" --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh api "repos/$REPO/issues/$n/comments" -F body=@"$B/issue.md" > /dev/null
          else
            gh api "repos/$REPO/issues" -f title="Blog diario: no se publicó" -F body=@"$B/issue.md" -f "labels[]=blog-diario" > /dev/null
          fi
          [ -n "$pr" ] && gh api "repos/$REPO/issues/$pr/comments" -F body=@"$B/issue.md" > /dev/null || true
